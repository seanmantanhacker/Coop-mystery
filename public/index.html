<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot-Riggock | Agent Messenger</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #0f111a;
            --bg-card: rgba(20, 24, 38, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.15);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --user-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --agent-bg: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #chat-app {
            width: 90vw;
            max-width: 950px;
            height: 85vh;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #app-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 11, 16, 0.5);
        }

        .header-title-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-glow {
            width: 32px;
            height: 32px;
            background: var(--user-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.5px;
        }

        .app-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444; /* Offline */
            box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .status-dot.connecting {
            background: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #messages {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Message row layouts */
        .message-row {
            display: flex;
            width: 100%;
            gap: 14px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user-row {
            justify-content: flex-end;
        }

        .message-row.agent-row {
            justify-content: flex-start;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-row .avatar {
            background: var(--user-gradient);
            color: white;
            order: 2;
        }

        .agent-row .avatar {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
        }

        .bubble {
            padding: 14px 20px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .user-row .bubble {
            background: var(--user-gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .agent-row .bubble {
            background: var(--agent-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .system-row {
            justify-content: center;
        }

        .system-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .system-badge.error {
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Stderr layout */
        .stderr-box {
            background: rgba(245, 158, 11, 0.06);
            border-left: 3px solid #f59e0b;
            padding: 10px 14px;
            margin-top: 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #fde047;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        /* Markdown styling inside bubble */
        .bubble p {
            margin: 0 0 12px 0;
        }
        .bubble p:last-child {
            margin-bottom: 0;
        }
        .bubble code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.88em;
            color: #ff79c6;
        }
        .bubble pre {
            margin: 14px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #181825 !important;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bubble pre code {
            background: none;
            padding: 14px;
            display: block;
            overflow-x: auto;
            color: inherit;
        }
        .bubble ul, .bubble ol {
            margin: 0 0 12px 0;
            padding-left: 20px;
        }
        .bubble li {
            margin-bottom: 6px;
        }

        /* Code block wrapper and copy button */
        .code-container {
            position: relative;
            margin: 16px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }
        .code-container pre {
            margin: 0;
            border: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11111b;
            padding: 8px 14px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .code-header .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .code-header .copy-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Status & typing panel */
        #status-panel {
            background: rgba(10, 11, 16, 0.5);
            display: flex;
            flex-direction: column;
        }

        #thinking-container {
            display: none;
            padding: 12px 24px;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .thinking-pulse {
            width: 10px;
            height: 10px;
            background: var(--accent-purple);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-purple);
            animation: glowPulse 1.5s infinite ease-in-out;
        }

        @keyframes glowPulse {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 4px var(--accent-purple); }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 16px var(--accent-purple); }
            100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 4px var(--accent-purple); }
        }

        /* Quick Actions chips */
        #quick-actions {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .action-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .action-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-1px);
        }

        /* Input area */
        #input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(10, 11, 16, 0.7);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            font-family: inherit;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #userInput:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(255, 255, 255, 0.04);
        }

        #sendBtn {
            background: var(--user-gradient);
            border: none;
            color: white;
            border-radius: 14px;
            padding: 14px 26px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        /* Scrollbars customization */
        #messages::-webkit-scrollbar {
            width: 6px;
        }
        #messages::-webkit-scrollbar-track {
            background: transparent;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        #messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div id="chat-app">
    <div id="app-header">
        <div class="header-title-section">
            <div class="logo-glow">BR</div>
            <h1 class="app-title">Bot-Riggock Control Center</h1>
        </div>
        <div class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting</span>
        </div>
    </div>

    <div id="messages">
        <!-- Messages will be populated here -->
    </div>

    <div id="status-panel">
        <div id="thinking-container">
            <span class="thinking-pulse"></span>
            <span id="thinking-text">Initializing Antigravity Agent...</span>
        </div>

        <div id="quick-actions">
            <button class="action-chip" onclick="usePreset('Check project status')">Check Status</button>
            <button class="action-chip" onclick="usePreset('List repository structure')">List Repository</button>
            <button class="action-chip" onclick="usePreset('Run tests')">Run Tests</button>
            <button class="action-chip" onclick="usePreset('Analyze package.json dependencies')">Analyze Deps</button>
        </div>

        <div id="input-area">
            <input type="text" id="userInput" placeholder="Ask Bot-Riggock to perform a task..." onkeypress="handleEnter(event)">
            <button id="sendBtn" onclick="sendMessage()">
                <span>Send</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

<script>
    let ws;
    const messagesDiv = document.getElementById('messages');
    const inputField = document.getElementById('userInput');
    const thinkingContainer = document.getElementById('thinking-container');
    const thinkingText = document.getElementById('thinking-text');

    let currentAgentText = '';
    let currentAgentBubble = null;

    // Defensive Markdown Parser Fallback
    function parseMarkdown(text) {
        if (typeof marked !== 'undefined') {
            return marked.parse(text);
        }
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/`(.*?)`/g, '<code>$1</code>');
    }

    function connect() {
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        statusDot.className = 'status-dot connecting';
        statusText.textContent = 'Connecting';
        
        ws = new WebSocket('ws://' + window.location.hostname + ':3000');
        
        ws.onopen = () => {
            statusDot.className = 'status-dot online';
            statusText.textContent = 'Online';
        };
        
        ws.onclose = () => {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Offline (Reconnecting...)';
            showThinking(false);
            setTimeout(connect, 3000);
        };
        
        ws.onerror = (err) => {
            console.error('WS Error:', err);
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.sender === 'system') {
                if (data.event === 'start') {
                    showThinking(true, data.text);
                    addSystemMessage(data.text);
                } else if (data.event === 'close') {
                    showThinking(false);
                    addSystemMessage('Task Completed');
                    currentAgentBubble = null;
                    currentAgentText = '';
                } else if (data.event === 'error') {
                    showThinking(false);
                    addSystemMessage(data.text, true);
                    currentAgentBubble = null;
                    currentAgentText = '';
                }
            } else if (data.sender === 'agent') {
                showThinking(false);
                if (data.event === 'chunk') {
                    if (!currentAgentBubble) {
                        const bubbleData = createAgentBubble();
                        currentAgentBubble = bubbleData.bubbleEl;
                        currentAgentText = '';
                    }
                    currentAgentText += data.text;
                    
                    // Render markdown & update UI
                    currentAgentBubble.innerHTML = parseMarkdown(currentAgentText);
                    
                    // Add copy buttons and wrap code blocks
                    formatCodeBlocks(currentAgentBubble);
                    
                    // Highlight syntax if Prism is loaded
                    if (typeof Prism !== 'undefined') {
                        Prism.highlightAllUnder(currentAgentBubble);
                    }
                    scrollToBottom();
                } else if (data.event === 'stderr') {
                    if (!currentAgentBubble) {
                        const bubbleData = createAgentBubble();
                        currentAgentBubble = bubbleData.bubbleEl;
                        currentAgentText = '';
                    }
                    appendStderr(currentAgentBubble, data.text);
                    scrollToBottom();
                }
            }
        };
    }

    function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        
        if (ws && ws.readyState === WebSocket.OPEN) {
            createUserBubble(text);
            ws.send(text);
            inputField.value = '';
            showThinking(true, "Connecting to agent...");
        } else {
            addSystemMessage("Error: Messenger is not connected to the server.", true);
        }
    }

    function createUserBubble(text) {
        const row = document.createElement('div');
        row.className = 'message-row user-row';
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'ME';
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        
        row.appendChild(bubble);
        row.appendChild(avatar);
        messagesDiv.appendChild(row);
        scrollToBottom();
    }

    function createAgentBubble() {
        const row = document.createElement('div');
        row.className = 'message-row agent-row';
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'AG';
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesDiv.appendChild(row);
        
        return { rowEl: row, bubbleEl: bubble };
    }

    function addSystemMessage(text, isError = false) {
        const row = document.createElement('div');
        row.className = 'message-row system-row';
        
        const badge = document.createElement('div');
        badge.className = `system-badge ${isError ? 'error' : ''}`;
        badge.textContent = text;
        
        row.appendChild(badge);
        messagesDiv.appendChild(row);
        scrollToBottom();
    }

    function appendStderr(bubbleEl, text) {
        let stderrBox = bubbleEl.querySelector('.stderr-box');
        if (!stderrBox) {
            stderrBox = document.createElement('div');
            stderrBox.className = 'stderr-box';
            bubbleEl.appendChild(stderrBox);
        }
        stderrBox.textContent += text;
    }

    function showThinking(visible, text = "Thinking...") {
        if (visible) {
            thinkingText.textContent = text;
            thinkingContainer.style.display = 'flex';
        } else {
            thinkingContainer.style.display = 'none';
        }
    }

    function usePreset(text) {
        inputField.value = text;
        inputField.focus();
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function formatCodeBlocks(bubbleEl) {
        const preElements = bubbleEl.querySelectorAll('pre');
        preElements.forEach(pre => {
            if (pre.parentNode.classList.contains('code-container')) return;
            
            const codeEl = pre.querySelector('code');
            const classes = codeEl ? codeEl.className.split(' ') : [];
            let lang = 'code';
            for (const cls of classes) {
                if (cls.startsWith('language-')) {
                    lang = cls.replace('language-', '');
                    break;
                }
            }
            
            const container = document.createElement('div');
            container.className = 'code-container';
            
            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `
                <span class="code-lang">${lang.toUpperCase()}</span>
                <button class="copy-btn" onclick="copyCode(this)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span>Copy</span>
                </button>
            `;
            
            pre.parentNode.insertBefore(container, pre);
            container.appendChild(header);
            container.appendChild(pre);
        });
    }

    function copyCode(btn) {
        const container = btn.closest('.code-container');
        const code = container.querySelector('code').textContent;
        navigator.clipboard.writeText(code).then(() => {
            const btnSpan = btn.querySelector('span');
            const btnSvg = btn.querySelector('svg');
            
            btnSvg.outerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            btnSpan.textContent = 'Copied!';
            btnSpan.style.color = '#10b981';
            
            setTimeout(() => {
                btn.innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span>Copy</span>
                `;
            }, 2000);
        });
    }

    // Initialize Connection
    connect();
</script>
</body>
</html>
